services:
  lab:
    image: docker.io/davidvonthenen/netapp-instaclustr-agentic-lab-dev:0.0.16
    container_name: agentic-lab
    working_dir: /workspace/agentic-rag
    stdin_open: true
    tty: true
    environment:
      # OPENSEARCH_HOST: opensearch-single
      # OPENSEARCH_DASHBOARDS_URL: http://opensearch-single-dashboards:5601
      LAB_HEALTH_URL: http://lab:8088/healthz
      LAB_REPO_DIR: /workspace/agentic-rag
      LAB_CONTAINER: "true"
      HF_HOME: /home/lab/.cache/huggingface
      USE_EXTERNAL_AI: ${USE_EXTERNAL_AI:-true}
      USE_EXTERNAL_OPENAI: ${USE_EXTERNAL_OPENAI:-true}
      USE_EXTERNAL_ORCH_AI: ${USE_EXTERNAL_ORCH_AI:-}
      USE_EXTERNAL_LLM_AI: ${USE_EXTERNAL_LLM_AI:-}
      HF_TOKEN: ${HF_TOKEN:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.4}
      USE_EXTERNAL_ORCH_AI: ${USE_EXTERNAL_ORCH_AI:-}
      EXTERNAL_ORCH_URL: ${EXTERNAL_ORCH_URL:-}
      EXTERNAL_ORCH_API_KEY: ${EXTERNAL_ORCH_API_KEY:-}
      EXTERNAL_ORCH_MODEL: ${EXTERNAL_ORCH_MODEL:-}
      EXTERNAL_ORCH_MAX_TOKENS: ${EXTERNAL_ORCH_MAX_TOKENS:-127000}
      USE_EXTERNAL_LLM_AI: ${USE_EXTERNAL_LLM_AI:-}
      EXTERNAL_LLM_URL: ${EXTERNAL_LLM_URL:-}
      EXTERNAL_LLM_API_KEY: ${EXTERNAL_LLM_API_KEY:-}
      EXTERNAL_LLM_MODEL: ${EXTERNAL_LLM_MODEL:-}
      EXTERNAL_LLM_MAX_TOKENS: ${EXTERNAL_LLM_MAX_TOKENS:-127000}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      FINNHUB_API_KEY: ${FINNHUB_API_KEY:-}

